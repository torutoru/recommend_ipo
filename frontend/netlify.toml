# recommend_ipo frontend — Netlify 설정
#
# 저장소를 Netlify 사이트에 연결할 때 "Base directory" 를 `frontend` 로 지정합니다.
# `base` 가 설정되면 아래 command/publish 는 base 기준 상대 경로입니다.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # 벨트+멜빵: .env.production 이 커밋되어도, 혹시 누락되거나 플랫폼 변수가
  # 바뀌어도 운영 빌드가 목업으로 떨어지지 않게 여기서도 명시.
  VITE_USE_MOCK = "false"

# ───────────────────────────────────────────────────────────────────────────────
# `/api/*` 프록시 — 반드시 SPA fallback 보다 "위" 에 와야 합니다.
# target 호스트: Render 백엔드. 변경 시 아래 to= 한 줄만 수정 후 커밋.
# 같은 오리진으로 호출되어 CORS 설정이 필요 없고, 백엔드 주소도 노출되지 않습니다.
# ───────────────────────────────────────────────────────────────────────────────

[[redirects]]
  from = "/api/*"
  to = "https://recommend-ipo-api.onrender.com/api/:splat"
  status = 200
  force = true

# ───────────────────────────────────────────────────────────────────────────────
# SPA fallback — React Router 경로를 index.html 로 돌려 보냅니다.
# `/api/*` 다음에 둡니다 (순서 중요).
# ───────────────────────────────────────────────────────────────────────────────

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ───────────────────────────────────────────────────────────────────────────────
# v1.11 (#32): PWA 캐시 헤더
#   - sw.js, workbox-*.js: 매 요청마다 네트워크 확인 (업데이트 즉시 반영).
#   - manifest.webmanifest: 자주 바뀌지는 않지만 캐시 수명 짧게.
# ───────────────────────────────────────────────────────────────────────────────

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
